<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Brand Cyan-Blue-Indigo Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Elements -->
  <circle cx="200" cy="180" r="350" fill="url(#glowEffect)" />
  <circle cx="1000" cy="450" r="400" fill="url(#glowEffect)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(80, 85)">
    <rect width="280" height="42" rx="21" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" opacity="0.9" />
    <circle cx="24" cy="21" r="6" fill="#10B981" />
    <text x="42" y="27" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1">AI-POWERED GROWTH HUB</text>
  </g>

  <!-- Brand Logo Icon -->
  <g transform="translate(80, 165)">
    <!-- Starburst Nova Symbol -->
    <path d="M40 0 C40 22 22 40 0 40 C22 40 40 58 40 80 C40 58 58 40 80 40 C58 40 40 22 40 0 Z" fill="url(#brandGrad)" />
    <circle cx="40" cy="40" r="7" fill="#FFFFFF" />
    <text x="100" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">Career<tspan fill="#38BDF8">Nova</tspan></text>
  </g>

  <!-- Headline -->
  <text x="80" y="315" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" line-height="1.2">
    AI-Powered Career Hub &amp;
  </text>
  <text x="80" y="375" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">
    Strategic Growth Solutions
  </text>

  <!-- Subtitle / Value Proposition -->
  <text x="80" y="440" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
    Full-Stack Web Engineering • iOS Development • AI Integrations • Targeted Growth
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 485)">
    <!-- Pill 1: ATS Resume -->
    <g transform="translate(0, 0)">
      <rect width="210" height="48" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="30" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">📄 ATS Resume Studio</text>
    </g>
    <!-- Pill 2: AI Mock Coach -->
    <g transform="translate(230, 0)">
      <rect width="210" height="48" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="30" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🤖 AI Interview Coach</text>
    </g>
    <!-- Pill 3: Business Calculators -->
    <g transform="translate(460, 0)">
      <rect width="220" height="48" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="30" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🚀 Business Engine</text>
    </g>
    <!-- Pill 4: Web & iOS Dev -->
    <g transform="translate(700, 0)">
      <rect width="210" height="48" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="30" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">💻 Full-Stack &amp; iOS</text>
    </g>
  </g>

  <!-- URL Branding on bottom right -->
  <text x="1100" y="570" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">careernova.netlify.app</text>
</svg>
